<!DOCTYPE html>
<html>
<head>
  <title>News</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      background: #f2f2f7;
      color: #111;
    }

    header {
      padding: 18px 16px 10px 16px;
      font-size: 28px;
      font-weight: 700;
      background: #f2f2f7;
      position: sticky;
      top: 0;
    }

    #updated {
      font-size: 12px;
      color: #8e8e93;
      margin-top: 4px;
      font-weight: 400;
    }

    .container {
      padding: 10px 14px 30px 14px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      transition: transform 0.05s ease;
    }

    .card:active {
      transform: scale(0.98);
    }

    .source {
      font-size: 12px;
      color: #007aff;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }

    .title {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.35;
      color: #111;
      text-decoration: none;
      display: block;
    }

    .title:active {
      opacity: 0.6;
    }

    .spacer {
      height: 10px;
    }
  </style>
</head>

<body>

<header>
  News
  <div id="updated"></div>
</header>

<div class="container" id="news"></div>

<script>
fetch('news.json')
  .then(res => res.json())
  .then(data => {

    document.getElementById('updated').innerText =
      "Updated " + new Date(data.updated).toLocaleString();

    let html = "";

    data.articles.forEach(a => {
      html += `
        <div class="card">
          <div class="source">${a.source}</div>
          <a class="title" href="${a.link}" target="_blank">
            ${a.title}
          </a>
        </div>
      `;
    });

    document.getElementById('news').innerHTML = html;
  });
</script>

</body>
</html>
